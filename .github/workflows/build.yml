name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Show project files
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter *.csproj

      - name: Restore MAUI workloads
        run: dotnet workload restore ./StarterApp/StarterApp.csproj

      - name: Restore database project
        run: dotnet restore ./StarterApp.Database/StarterApp.Database.csproj

      - name: Build database project
        run: dotnet build ./StarterApp.Database/StarterApp.Database.csproj --configuration Release --no-restore

      - name: Clean old test results
        shell: pwsh
        run: |
          if (Test-Path StarterApp.Tests/TestResults) { Remove-Item StarterApp.Tests/TestResults -Recurse -Force }
          if (Test-Path coverage-report) { Remove-Item coverage-report -Recurse -Force }

      - name: Restore test project
        run: dotnet restore ./StarterApp.Tests/StarterApp.Tests.csproj

      - name: Build test project
        run: dotnet build ./StarterApp.Tests/StarterApp.Tests.csproj --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test ./StarterApp.Tests/StarterApp.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./StarterApp.Tests/TestResults

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator `
            -reports:"StarterApp.Tests/TestResults/**/coverage.cobertura.xml" `
            -targetdir:"coverage-report" `
            -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Show coverage summary in GitHub
        shell: pwsh
        run: Get-Content coverage-report/SummaryGithub.md | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: coverage-report
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: StarterApp.Tests/TestResults/**
          if-no-files-found: error
