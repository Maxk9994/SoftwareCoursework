name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=test_db;Username=test_user;Password=test_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 Preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore database project
        run: dotnet restore ./StarterApp.Database/StarterApp.Database.csproj

      - name: Build database project
        run: dotnet build ./StarterApp.Database/StarterApp.Database.csproj --configuration Release --no-restore

      - name: Restore test project
        run: dotnet restore ./StarterApp.Tests/StarterApp.Tests.csproj

      - name: Build test project
        run: dotnet build ./StarterApp.Tests/StarterApp.Tests.csproj --configuration Release --no-restore

      - name: Run tests with code coverage
        run: dotnet test ./StarterApp.Tests/StarterApp.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./StarterApp.Tests/TestResults

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: ./StarterApp.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./StarterApp.Tests/TestResults
          if-no-files-found: error
